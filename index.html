<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الزير - متجر الكتب</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            color: #38bdf8;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h3 {
            margin-top: 0;
            color: #f1f5f9;
        }
        .price {
            color: #34d399;
            font-weight: bold;
            font-size: 1.2rem;
            margin: 15px 0;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <header>
        <h1>مكتبة المعرفة</h1>
        <p>اكتشف أفضل الكتب ورواق المعرفة الرقمية</p>
    </header>

    <div class="container">
        <div class="card">
            <h3>كتاب فن الحرب</h3>
            <p>دليلك الاستراتيجي لفهم الصراعات وإدارة التخطيط بحكمة.</p>
            <div class="price">$15.00</div>
            <button class="btn">اطلب الكتاب</button>
        </div>

        <div class="card">
            <h3>كتاب الإدارة الحديثة</h3>
            <p>أساليب متطورة لبناء المشاريع وإدارتها بكفاءة عالية.</p>
            <div class="price">$22.50</div>
            <button class="btn">اطلب الكتاب</button>
        </div>
    </div>

</body>
</html>
